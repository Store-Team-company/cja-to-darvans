name: SiteGround install package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'deploy/**'
      - 'docs/SITEGROUND_INSTALL.md'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'scripts/build-siteground.php'
      - 'scripts/build-siteground-ui-update.php'
      - 'scripts/build-siteground-saas-update.php'
      - 'scripts/apply-siteground-saas-update.php'
      - 'scripts/verify-siteground-saas-update.php'
      - 'docs/SITEGROUND_SAAS_INCREMENTAL_UPDATE.md'
      - 'docs/SITEGROUND_UI_CATEGORY_REPAIR.md'
      - 'scripts/deploy-siteground-ui-category-repair.php'
      - 'scripts/verify-ui-category-deployer.php'
      - 'scripts/deploy-siteground-saas-02.php'
      - 'scripts/deploy-siteground-auth03.php'
      - 'scripts/verify-siteground-auth03.php'
      - 'scripts/deploy-siteground-auth04.php'
      - 'scripts/verify-siteground-auth04.php'
      - 'scripts/deploy-siteground-auth05.php'
      - 'scripts/deploy-siteground-botble04.php'
      - 'scripts/deploy-siteground-cj01.php'
      - 'scripts/deploy-siteground-product01.php'
      - 'scripts/deploy-siteground-billing03.php'
      - 'scripts/verify-siteground-billing03.php'
      - 'docs/DATAPILOT_BILLING_03_STRIPE_AND_ADMIN_GRANTS.md'
      - 'scripts/verify-siteground-product01.php'
      - 'docs/DATAPILOT_PRODUCT_01_CJ_DRAFT_IMPORT.md'
      - 'scripts/verify-siteground-cj01.php'
      - 'scripts/diagnose-siteground-cj01.php'
      - 'database/migrations/2026_10_23_000006_add_saas_cj_auth_state.php'
      - 'scripts/verify-siteground-botble04.php'
      - 'database/migrations/2026_10_22_000005_create_saas_botble_pairing_challenges.php'
      - 'scripts/verify-siteground-auth05.php'
      - 'scripts/diagnose-siteground-auth04.php'
      - 'docs/DATAPILOT_AUTH_04_SITEGROUND_RUNBOOK.md'
      - 'docs/DATAPILOT_BOTBLE_04_SANDBOX_PAIRING.md'
      - 'docs/DATAPILOT_CJ_01_QA_AND_SITEGROUND.md'
      - 'scripts/verify-siteground-saas-02.php'
      - 'docs/SAAS_CUSTOMER_PORTAL_STRIPE_02.md'
      - 'docs/SITEGROUND_UI_UPDATE.md'
      - 'composer.*'
      - 'phpunit.xml'
      - 'integrations/botble-connector/**'
      - '.github/workflows/siteground-package.yml'

jobs:
  tests:
    name: Test application and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_mysql, sqlite3, zip, dom, xml
          coverage: none
      - name: Validate PHP syntax
        run: |
          find app bootstrap config database deploy public routes scripts tests integrations/botble-connector -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Regression suite
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

  package:
    name: Build safe shared-hosting ZIP
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, dom, xml
          coverage: none
      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Build and verify SiteGround upload ZIP
        run: php scripts/build-siteground.php
      - name: Build safe UI-only SiteGround update
        run: php scripts/build-siteground-ui-update.php
      - name: Verify safe SSH repair deployer
        run: |
          # PR checkouts are detached; give the smoke test its expected reviewed branch name.
          git switch -c feature/datapilot-ui-category-repair-20261022
          php scripts/verify-ui-category-deployer.php
      - name: Verify SaaS-02 staging deployer against exact approved SaaS-02 release
        run: |
          git fetch origin feature/datapilot-saas-02-portal-stripe-billing
          git worktree add --detach /tmp/datapilot-saas02-reviewed FETCH_HEAD
          cd /tmp/datapilot-saas02-reviewed
          git switch -c feature/datapilot-saas-02-portal-stripe-billing
          php scripts/verify-siteground-saas-02.php
      - name: Verify AUTH-03 login update deployment safety
        run: |
          git switch -c feature/datapilot-auth-03-email-otp-optional-password
          php scripts/verify-siteground-auth03.php
      - name: Verify AUTH-04 safe selective staging updater
        run: |
          git switch -c fix/datapilot-auth-04-otp-mail-delivery
          php scripts/verify-siteground-auth04.php
      - name: Verify AUTH-05 SiteGround customization-safe selective updater
        run: |
          git switch -c fix/datapilot-auth-05-safe-live-route-merge
          php scripts/verify-siteground-auth05.php
      - name: Verify BOTBLE-04 selective staging pairing installer
        run: |
          git switch -c feature/datapilot-botble-04-password-pilot-pairing
          php scripts/verify-siteground-botble04.php
      - name: Verify CJ-01 selective staging installer
        run: |
          git switch -c feature/datapilot-cj-01-secure-connection
          php scripts/verify-siteground-cj01.php
      - name: Verify PRODUCT-01 selective SiteGround installer
        run: |
          git switch -c feature/datapilot-product-01-cj-draft-import
          php scripts/verify-siteground-product01.php
      - name: Verify BILLING-03 selective SiteGround installer
        run: |
          git switch -c feature/datapilot-billing-03-admin-grants
          php scripts/verify-siteground-billing03.php
      - name: Verify PRODUCT-02 selective customer CJ importer updater
        run: |
          git switch -c feature/datapilot-product-02-selective-cj-search
          php scripts/verify-siteground-product02.php
      - name: Verify PRODUCT-03 separated customer catalog selective installer
        run: |
          git switch -c feature/datapilot-product-03-customer-catalog
          php scripts/verify-siteground-product03.php
      - name: Verify PRODUCT-04 rich CJ details editor safe installer
        run: |
          git switch -c feature/datapilot-product-04-full-cj-details-editor
          php scripts/verify-siteground-product04.php
      - name: Verify BOTBLE-PUBLISH-01A signed draft delivery installer
        run: |
          git switch -c feature/datapilot-botble-publish-01a-signed-draft-delivery
          php scripts/verify-siteground-publish01a.php
      - name: Verify BOTBLE-PUBLISH-01B1 full variation sender installer
        run: |
          git switch -c feature/datapilot-botble-publish-01b1-complete-variants
          php scripts/verify-siteground-publish01b1.php
      - name: Build and smoke-check incremental SaaS update
        run: |
          php scripts/build-siteground-saas-update.php
          php scripts/verify-siteground-saas-update.php
      - name: Publish SaaS changes-only update
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-saas-changes-only
          path: dist/data-pilot-saas-changes-only.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish UI-only update
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-siteground-ui-update
          path: dist/data-pilot-siteground-ui-update.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish upload package
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-siteground-upload
          path: dist/data-pilot-siteground.zip
          if-no-files-found: error
          retention-days: 7
