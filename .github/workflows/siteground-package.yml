name: SiteGround install package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'deploy/**'
      - 'docs/SITEGROUND_INSTALL.md'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'scripts/build-siteground.php'
      - 'scripts/build-siteground-ui-update.php'
      - 'scripts/build-siteground-saas-update.php'
      - 'scripts/apply-siteground-saas-update.php'
      - 'scripts/verify-siteground-saas-update.php'
      - 'docs/SITEGROUND_SAAS_INCREMENTAL_UPDATE.md'
      - 'docs/SITEGROUND_UI_CATEGORY_REPAIR.md'
      - 'scripts/deploy-siteground-ui-category-repair.php'
      - 'scripts/verify-ui-category-deployer.php'
      - 'scripts/deploy-siteground-saas-02.php'
      - 'scripts/deploy-siteground-auth03.php'
      - 'scripts/build-botble-connector.php'
      - 'scripts/deploy-siteground-botble03a.php'
      - 'scripts/verify-siteground-botble03a.php'
      - 'scripts/deploy-siteground-admin04.php'
      - 'scripts/verify-siteground-admin04.php'
      - 'scripts/verify-siteground-auth03.php'
      - 'scripts/verify-siteground-saas-02.php'
      - 'docs/SAAS_CUSTOMER_PORTAL_STRIPE_02.md'
      - 'docs/SITEGROUND_UI_UPDATE.md'
      - 'composer.*'
      - 'phpunit.xml'
      - 'integrations/botble-connector/**'
      - '.github/workflows/siteground-package.yml'

jobs:
  tests:
    name: Test application and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_mysql, sqlite3, zip, dom, xml
          coverage: none
      - name: Validate PHP syntax
        run: |
          find app bootstrap config database deploy public routes scripts tests integrations/botble-connector -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Regression suite
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

  package:
    name: Build safe shared-hosting ZIP
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, dom, xml
          coverage: none
      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Build and verify SiteGround upload ZIP
        run: php scripts/build-siteground.php
      - name: Build safe UI-only SiteGround update
        run: php scripts/build-siteground-ui-update.php
      - name: Verify safe SSH repair deployer
        run: |
          # PR checkouts are detached; give the smoke test its expected reviewed branch name.
          git switch -c feature/datapilot-ui-category-repair-20261022
          php scripts/verify-ui-category-deployer.php
      - name: Verify SaaS-02 staging deployer against exact approved SaaS-02 release
        run: |
          git fetch origin feature/datapilot-saas-02-portal-stripe-billing
          git worktree add --detach /tmp/datapilot-saas02-reviewed FETCH_HEAD
          cd /tmp/datapilot-saas02-reviewed
          git switch -c feature/datapilot-saas-02-portal-stripe-billing
          php scripts/verify-siteground-saas-02.php
      - name: Verify AUTH-03 login update deployment safety
        run: |
          git switch -c feature/datapilot-auth-03-email-otp-optional-password
          php scripts/verify-siteground-auth03.php
      - name: Verify BOTBLE-03A SaaS changes-only deployment
        run: |
          git switch -c feature/datapilot-botble-connector-03a-pairing-inbox
          php scripts/verify-siteground-botble03a.php
      - name: Verify ADMIN-04 SiteGround customer management deployment
        run: |
          git switch -c feature/datapilot-admin-04-customer-management
          php scripts/verify-siteground-admin04.php
      - name: Build and smoke-check incremental SaaS update
        run: |
          php scripts/build-siteground-saas-update.php
          php scripts/verify-siteground-saas-update.php
      - name: Publish SaaS changes-only update
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-saas-changes-only
          path: dist/data-pilot-saas-changes-only.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish UI-only update
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-siteground-ui-update
          path: dist/data-pilot-siteground-ui-update.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish upload package
        uses: actions/upload-artifact@v4
        with:
          name: data-pilot-siteground-upload
          path: dist/data-pilot-siteground.zip
          if-no-files-found: error
          retention-days: 7


  botble_plugin:
    name: Package Data Pilot Botble Connector
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring
          coverage: none
      - name: Build independently installable Botble plugin ZIP
        run: php scripts/build-botble-connector.php
      - name: Upload Botble plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: datapilot-botble-connector-0.2.0
          path: dist/datapilot-connector-0.2.0.zip
          retention-days: 14
          if-no-files-found: error
