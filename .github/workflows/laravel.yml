name: Laravel integration regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, dom, xml
          coverage: none
      - name: Validate PHP syntax
        run: |
          find app config database routes tests integrations/botble-connector -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Output Pint formatting patch for AUTH-04 review
        run: |
          ./vendor/bin/pint \
            app/Services/Saas/SaasEmailOtpService.php \
            app/Http/Controllers/Saas/SaasAuthController.php \
            tests/Feature/SaasOtpMailDiagnosticsTest.php \
            scripts/diagnose-siteground-auth04.php \
            scripts/deploy-siteground-auth04.php \
            scripts/verify-siteground-auth04.php
          git diff --no-color --no-ext-diff --unified=3 -- \
            app/Services/Saas/SaasEmailOtpService.php \
            app/Http/Controllers/Saas/SaasAuthController.php \
            tests/Feature/SaasOtpMailDiagnosticsTest.php \
            scripts/diagnose-siteground-auth04.php \
            scripts/deploy-siteground-auth04.php \
            scripts/verify-siteground-auth04.php
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list
      - name: Execute PHPUnit
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
